services:
  traefik:
    image: traefik:3.5.2
    command:
      - --log.level=DEBUG
      - --accesslog=false
      - --accesslog.fields.defaultmode=keep
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.acme.acme.httpchallenge=true
      - --certificatesresolvers.acme.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.acme.acme.email=you@rjchicago.com
      - --certificatesresolvers.acme.acme.storage=/letsencrypt/acme.json
    labels:
      - traefik.enable=true

      # redirect naked domain -> www (HTTPS)
      - traefik.http.routers.redirect-root.rule=Host(`rjchicago.com`)
      - traefik.http.routers.redirect-root.entrypoints=websecure
      - traefik.http.routers.redirect-root.tls=true
      - traefik.http.routers.redirect-root.tls.certresolver=acme
      - traefik.http.routers.redirect-root.middlewares=redirect-to-www
      - traefik.http.routers.redirect-root.priority=100

      - traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https?://rjchicago\.com(.*)
      - traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.rjchicago.com$$1
      - traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./api/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - traefik
    restart: unless-stopped

  www-web:
    image: rjchicago/rjchicago-llc-web:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.www-web.rule=Host(`llc.rjchicago.com`)
      - traefik.http.routers.www-web.entrypoints=websecure
      - traefik.http.routers.www-web.tls=true
      - traefik.http.routers.www-web.tls.certresolver=acme
      - traefik.http.services.www-web.loadbalancer.server.port=3000
    networks:
      - traefik
    restart: unless-stopped
  
  www-api:
    image: rjchicago/rjchicago-llc-api:latest
    environment:
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGIN=https://llc.rjchicago.com
    labels:
      - traefik.enable=true
      - traefik.http.routers.www-api.rule=(Host(`llc.rjchicago.com`) && PathPrefix(`/api`)
      - traefik.http.routers.www-api.entrypoints=websecure
      - traefik.http.routers.www-api.tls=true
      - traefik.http.routers.www-api.tls.certresolver=acme
      - traefik.http.routers.www-api.middlewares=api-strip
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.services.www-api.loadbalancer.server.port=4000
    env_file:
      - ./api/.env
    networks:
      - traefik
    restart: unless-stopped

  rj-web:
    image: rjchicago/rj:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.rj-web.rule=Host(`www.rjchicago.com`) || Host(`rjchicago.com`)
      - traefik.http.routers.rj-web.entrypoints=websecure
      - traefik.http.routers.rj-web.tls=true
      - traefik.http.routers.rj-web.tls.certresolver=acme
      - traefik.http.services.rj-web.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

  cman:
    image: rjchicago/cman-web:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.cman.rule=Host(`cman.rjchicago.com`)
      - traefik.http.routers.cman.entrypoints=websecure
      - traefik.http.routers.cman.tls=true
      - traefik.http.routers.cman.tls.certresolver=acme
      - traefik.http.services.cman.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

  parti:
    image: rjchicago/parti:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.parti.rule=Host(`parti.rjchicago.com`)
      - traefik.http.routers.parti.entrypoints=websecure
      - traefik.http.routers.parti.tls=true
      - traefik.http.routers.parti.tls.certresolver=acme
      - traefik.http.services.parti.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

  waveform:
    image: rjchicago/waveform:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.waveform.rule=Host(`waveform.rjchicago.com`)
      - traefik.http.routers.waveform.entrypoints=websecure
      - traefik.http.routers.waveform.tls=true
      - traefik.http.routers.waveform.tls.certresolver=acme
      - traefik.http.services.waveform.loadbalancer.server.port=80
    networks:
      - traefik
    restart: unless-stopped

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v4
    env_file:
      - ./tinyauth/.env
    labels:
      traefik.enable: true

      # tinyauth UI
      traefik.http.routers.tinyauth.rule: Host(`tinyauth.rjchicago.com`)
      traefik.http.routers.tinyauth.entrypoints: websecure
      traefik.http.routers.tinyauth.tls: "true"
      traefik.http.routers.tinyauth.tls.certresolver: acme
      traefik.http.services.tinyauth.loadbalancer.server.port: "3000"

      # forwardAuth middleware (this is the key)
      traefik.http.middlewares.tinyauth.forwardauth.address: http://tinyauth:3000/api/auth/traefik
      traefik.http.middlewares.tinyauth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.tinyauth.forwardauth.authResponseHeaders: Remote-User,Remote-Email,Remote-Name
      traefik.http.middlewares.tinyauth.forwardauth.authRequestHeaders: Cookie
    networks:
      - traefik

  replyte-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: replyte
      POSTGRES_USER: replyte
      POSTGRES_PASSWORD: replyte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replyte -d replyte"]
      interval: 5s
      timeout: 5s
      retries: 5

  replyte-web:
    image: rjchicago/replyte-web:${TAG:-latest}
    build: ./web
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    labels:
      traefik.enable: true
      traefik.http.routers.web.rule: Host(`replyte.rjchicago.com`) && !PathPrefix(`/api`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls: true
      traefik.http.routers.web.tls.certresolver: acme
      traefik.http.routers.web.middlewares: tinyauth@docker
      traefik.http.routers.web.service: web-service
      traefik.http.services.web-service.loadbalancer.server.port: 3001
    networks:
      - traefik

  replyte-server:
    image: rjchicago/replyte-server:${TAG:-latest}
    build: ./server
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://replyte:replyte@replyte-db:5432/replyte
      - TINYAUTH_SECRET=dev-secret-key-change-in-production
    labels:
      traefik.enable: true
      
      # Auth routes (no middleware)
      traefik.http.routers.server-auth.rule: Host(`replyte.rjchicago.com`) && PathPrefix(`/auth`)
      traefik.http.routers.server-auth.entrypoints: websecure
      traefik.http.routers.server-auth.tls: true
      traefik.http.routers.server-auth.tls.certresolver: acme
      traefik.http.routers.server-auth.middlewares: ""
      traefik.http.routers.server-auth.service: server-service
      
      # API routes (with TinyAuth)
      traefik.http.routers.server-api.rule: Host(`replyte.rjchicago.com`) && PathPrefix(`/api`)
      traefik.http.routers.server-api.entrypoints: websecure
      traefik.http.routers.server-api.tls: true
      traefik.http.routers.server-api.tls.certresolver: acme
      traefik.http.routers.server-api.middlewares: tinyauth@docker
      traefik.http.routers.server-api.service: server-service
      
      # Sync routes (no auth - API key based)
      traefik.http.routers.server-sync.rule: Host(`replyte.rjchicago.com`) && PathPrefix(`/sync`)
      traefik.http.routers.server-sync.entrypoints: websecure
      traefik.http.routers.server-sync.tls: true
      traefik.http.routers.server-sync.tls.certresolver: acme
      traefik.http.routers.server-sync.middlewares: ""
      traefik.http.routers.server-sync.service: server-service
      
      traefik.http.services.server-service.loadbalancer.server.port: 3000
    networks:
      - traefik
    stdin_open: true
    tty: true

  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: asd0982314
    depends_on:
      umami-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.umami.rule=Host(`umami.rjchicago.com`) || Host(`stats.rjchicago.com`)
      - traefik.http.routers.umami.entrypoints=websecure
      - traefik.http.routers.umami.tls=true
      - traefik.http.routers.umami.tls.certresolver=acme
      - traefik.http.services.umami.loadbalancer.server.port=3000
    networks:
      - traefik
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - traefik
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  umami-db-data:
  postgres_data:

networks:
  traefik:
    name: traefik
    driver: bridge
